<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flee the Facility Store 🌸</title>
  <style>
    :root {
      --primary-color: #ffb6c1;
      --secondary-color: #ff69b4;
      --accent-color: #ff1493;
      --bg-color: #fff0f5;
      --text-color: #4a4a4a;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--primary-color);
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid var(--secondary-color);
      position: relative;
    }

    .header-banner {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid white;
    }

    h1 {
      color: white;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 2px solid var(--primary-color);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
    }

    .product-title {
      font-weight: bold;
      margin: 10px 0;
      color: var(--accent-color);
    }

    .product-price {
      font-size: 1.2em;
      color: #2e8b57;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .btn-add {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
      width: 100%;
    }

    .btn-add:hover {
      background-color: var(--accent-color);
    }

    .cart-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 99;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 450px;
      width: 90%;
      border: 3px solid var(--primary-color);
      position: relative;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5em;
      cursor: pointer;
      color: #aaa;
    }

    .close-button:hover {
      color: #000;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px dashed #eee;
      padding-bottom: 5px;
    }

    .pix-box {
      background: #fff0f5;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      border: 1px solid var(--primary-color);
      text-align: center;
    }

    .pix-input-group {
      display: flex;
      gap: 5px;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }

    .pix-input {
      width: 80%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.85em;
      text-align: center;
    }

    .btn-copy {
      padding: 8px 12px;
      background: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-checkout {
      width: 100%;
      padding: 12px;
      background-color: #7289da;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
    }

    .btn-checkout:hover {
      background-color: #5b6eae;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Flee the Facility Store 🌸</h1>
    </div>
  </header>

  <div class="container">
    <h2>Produtos Disponíveis</h2>
    <div class="products-grid">
      <!-- Exemplo de Produtos -->
      <div class="product-card">
        <div class="product-title">VIP Ticket / Marreta</div>
        <div class="product-price">R$ 5,00</div>
        <button class="btn-add" onclick="addToCart('VIP Ticket / Marreta', 5.00)">Adicionar ao Carrinho</button>
      </div>

      <div class="product-card">
        <div class="product-title">Conjunto Raro</div>
        <div class="product-price">R$ 10,00</div>
        <button class="btn-add" onclick="addToCart('Conjunto Raro', 10.00)">Adicionar ao Carrinho</button>
      </div>

      <div class="product-card">
        <div class="product-title">Item Épico</div>
        <div class="product-price">R$ 15,00</div>
        <button class="btn-add" onclick="addToCart('Item Épico', 15.00)">Adicionar ao Carrinho</button>
      </div>
    </div>
  </div>

  <!-- Botão Flutuante do Carrinho -->
  <button class="cart-float" onclick="toggleCart()">
    🛒 Carrinho (<span id="cart-count">0</span>)
  </button>

  <!-- Modal do Carrinho -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <span class="close-button" onclick="toggleCart()">&times;</span>
      <h2 style="color: var(--accent-color); margin-top: 0;">Teu Carrinho 🛒</h2>
      
      <div id="cart-items">
        <p style="color: #888;">O teu carrinho está vazio.</p>
      </div>

      <div style="margin: 15px 0; font-size: 1.1em; text-align: right;">
        <strong>Total:</strong> <span id="cart-total-price">R$ 0,00</span>
      </div>

      <!-- Caixa do Pagamento PIX -->
      <div class="pix-box">
        <h3 style="margin: 0; color: var(--accent-color);">Pagamento via PIX 💸</h3>
        <p style="font-size: 0.85em; margin: 5px 0; color: #666;">Copia a chave abaixo para fazer o pagamento:</p>
        
        <div class="pix-input-group">
          <input type="text" id="pix-key" value="0b74d70f-a956-46fe-a3c1-c83a8fc5033e" readonly class="pix-input">
          <button class="btn-copy" onclick="copyPixKey()">Copiar</button>
        </div>
        <small id="copy-status" style="color: green; display: none; margin-top: 5px;">Chave PIX copiada!</small>
      </div>

      <button class="btn-checkout" onclick="checkoutDiscord()">
        Enviar Comprovativo no Discord
      </button>
    </div>
  </div>

  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      
      const cartItemsContainer = document.getElementById('cart-items');
      const cartTotalContainer = document.getElementById('cart-total-price');
      
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="color: #888;">O teu carrinho está vazio.</p>';
        cartTotalContainer.innerText = 'R$ 0,00';
        return;
      }

      cartItemsContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        const itemElement = document.createElement('div');
        itemElement.className = 'cart-item';
        itemElement.innerHTML = `
          <span>${item.name}</span>
          <span>R$ ${item.price.toFixed(2)}</span>
        `;
        cartItemsContainer.appendChild(itemElement);
      });

      cartTotalContainer.innerText = `R$ ${total.toFixed(2)}`;
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function copyPixKey() {
      const pixInput = document.getElementById('pix-key');
      pixInput.select();
      pixInput.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(pixInput.value);
      
      const status = document.getElementById('copy-status');
      status.style.display = 'block';
      setTimeout(() => { status.style.display = 'none'; }, 3000);
    }

    function checkoutDiscord() {
      if (cart.length === 0) {
        alert('Adiciona pelo menos um produto ao carrinho!');
        return;
      }

      let total = cart.reduce((sum, item) => sum + item.price, 0);
      let orderText = "🌸 **NOVO PEDIDO - FLEE THE FACILITY STORE** 🌸\n\n";
      orderText += "**Itens do Pedido:**\n";
      cart.forEach(item => {
        orderText += `- ${item.name}: R$ ${item.price.toFixed(2)}\n`;
      });
      orderText += `\n**Total:** R$ ${total.toFixed(2)}\n`;
      orderText += "**Pagamento:** PIX Realizado ✅\n\n";
      orderText += "Aguardando confirmação do comprovativo!";

      navigator.clipboard.writeText(orderText).then(() => {
        alert('Pedido copiado com sucesso! Agora cola a mensagem no teu Ticket no Discord.');
      });
    }
  </script>
</body>
</html>
