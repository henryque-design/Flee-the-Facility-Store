<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frosted FTF | Loja de Itens</title>
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding-bottom: 30px;
        }

        /* CABEÇALHO */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.2rem;
            background-color: #12141d;
            border-bottom: 1px solid #1f2230;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .snowflake-icon {
            background-color: #38b6ff;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(56, 182, 255, 0.4);
        }

        .site-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background-color: #1e2230;
            border: 1px solid #2a2f42;
            color: #38b6ff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            text-decoration: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.2rem 0.8rem;
        }

        /* GRID DE PRODUTOS (2 COLUNAS) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* CARD DO PRODUTO */
        .card {
            background-color: #151821;
            border: 1px solid #1f2330;
            border-radius: 16px;
            padding: 1rem 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card-img-container {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
        }

        .card img {
            max-width: 100%;
            max-height: 100px;
            object-fit: contain;
            margin: 0 auto;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.6rem;
            min-height: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        .card-price {
            font-size: 0.75rem;
            color: #8f96a3;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .btn-add {
            width: 100%;
            background-color: #0099ff;
            color: #ffffff;
            border: none;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(0, 153, 255, 0.3);
        }

        .btn-add:active {
            transform: scale(0.97);
            background-color: #0088e0;
        }

        /* BOTÃO FLUTUANTE PARA O TOPO */
        .scroll-top-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #38b6ff;
            color: #ffffff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(56, 182, 255, 0.4);
            font-size: 1.2rem;
            z-index: 99;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo-area">
            <div class="snowflake-icon">
                <i class="fa-regular fa-snowflake"></i>
            </div>
            <span class="site-title">Frosted FTF</span>
        </div>
        <div class="header-actions">
            <a href="https://discord.gg/xjzaQD9hhS" class="icon-btn" target="_blank" title="Entrar no Discord">
                <i class="fa-brands fa-discord"></i>
            </a>
            <a href="https://discord.gg/xjzaQD9hhS" class="icon-btn" target="_blank" title="Abrir Menu">
                <i class="fa-solid fa-bars"></i>
            </a>
        </div>
    </header>

    <div class="container">
        <div class="products-grid">

            <!-- ITEM 1 -->
            <div class="card">
                <div class="card-img-container">
                    <img src="https://via.placeholder.com/150/151821/ff69b4?text=Strawberry+Moo" alt="Strawberry Moo Plushie">
                </div>
                <h3 class="card-title">Strawberry Moo Plushie</h3>
                <div class="card-price">R$ 200,00</div>
                <a href="https://discord.gg/xjzaQD9hhS" target="_blank" class="btn-add">
                    <i class="fa-solid fa-cart-plus"></i>
                </a>
            </div>

            <!-- ITEM 2 -->
            <div class="card">
                <div class="card-img-container">
                    <img src="https://via.placeholder.com/150/151821/00d2ff?text=Frosted" alt="Frosted">
                </div>
                <h3 class="card-title">Frosted</h3>
                <div class="card-price">R$ 19,99</div>
                <a href="https://discord.gg/xjzaQD9hhS" target="_blank" class="btn-add">
                    <i class="fa-solid fa-cart-plus"></i>
                </a>
            </div>

            <!-- ITEM 3 -->
            <div class="card">
                <div class="card-img-container">
                    <img src="https://via.placeholder.com/150/151821/ffcc00?text=Party+Balloons" alt="Party Balloons">
                </div>
                <h3 class="card-title">Party Balloons</h3>
                <div class="card-price">R$ 12,50</div>
                <a href="https://discord.gg/xjzaQD9hhS" target="_blank" class="btn-add">
                    <i class="fa-solid fa-cart-plus"></i>
                </a>
            </div>

            <!-- ITEM 4 -->
            <div class="card">
                <div class="card-img-container">
                    <img src="https://via.placeholder.com/150/151821/ff99cc?text=Carousel" alt="Carousel">
                </div>
                <h3 class="card-title">Carousel</h3>
                <div class="card-price">R$ 8,00</div>
                <a href="https://discord.gg/xjzaQD9hhS" target="_blank" class="btn-add">
                    <i class="fa-solid fa-cart-plus"></i>
                </a>
            </div>

            <!-- ITEM 5 -->
            <div class="card">
                <div class="card-img-container">
                    <img src="https://via.placeholder.com/150/151821/ffaa00?text=Popcorn+Stand" alt="Popcorn Stand">
                </div>
                <h3 class="card-title">Popcorn Stand</h3>
                <div class="card-price">R$ 8,00</div>
                <a href="https://discord.gg/xjzaQD9hhS" target="_blank" class="btn-add">
                    <i class="fa-solid fa-cart-plus"></i>
                </a>
            </div>

            <!-- ITEM 6 -->
            <div class="card">
                <div class="card-img-container">
                    <img src="https://via.placeholder.com/150/151821/ff3399?text=Lovesick+Bow" alt="Lovesick Bow">
                </div>
                <h3 class="card-title">Lovesick Bow</h3>
                <div class="card-price">R$ 7,50</div>
                <a href="https://discord.gg/xjzaQD9hhS" target="_blank" class="btn-add">
                    <i class="fa-solid fa-cart-plus"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- BOTÃO FLUTUANTE PARA SUBIR -->
    <a href="#" class="scroll-top-btn">
        <i class="fa-solid fa-arrow-up"></i>
    </a>

</body>
</html>
